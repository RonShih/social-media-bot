  competitors: []

media_library:
  assets_dir: media/assets/noirs-boxes
  inbox_dir: media/assets/noirs-boxes/inbox
  hints:
    - "dark / moody backgrounds; gold and burgundy accents"
    - "show the box closed before reveal"
    - "occult-adjacent props OK; avoid horror or violent imagery"

storage:
