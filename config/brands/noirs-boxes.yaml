content_themes:
  - unboxing reveal
  - behind-the-curation
  - collector spotlight
  - regional drop announcement
  - trend / lore commentary

content_style:
  facebook:  { caption_length: medium, hashtag_count: 3, link_policy: og_card,  notes: "" }
  instagram: { caption_length: medium, hashtag_count: 8, link_policy: bio_only, notes: "blank line then hashtag block" }
  x:         { caption_length: short,  hashtag_count: 2, link_policy: inline,   notes: "<=280 chars total incl. tags" }
  threads:   { caption_length: medium, hashtag_count: 1, link_policy: inline,   notes: "" }
  youtube:   { caption_length: long,   hashtag_count: 8, link_policy: inline,   notes: "SEO-leaning description" }
  tiktok:    { caption_length: short,  hashtag_count: 5, link_policy: bio_only, notes: "trend-aware tags" }

competitors: []

reference_urls:
  own:
    - https://www.facebook.com/BlackMagicNoirsBoxes/
    - https://www.instagram.com/black_magic_noirsboxes/
    - https://x.com/NoirsBoxes
    - https://www.tiktok.com/@noirs.boxes
