brand:
  slug: noirs-boxes
  display_name: "Black Magic Noir's Boxes"
  primary_language: en
  secondary_languages: [zh-TW, ja]

company:
  description: |
    Curated collectible boxes — themed mystery / variety SKU lineup with
    global distribution via Amazon US, Taobao, and Rakuten JP. Audience
    skews collectors, gift-buyers, and trend-followers.
  website: https://www.amazon.com/dp/B0DZBZ9W55
  email: ""

voice:
  tone: "playful-mysterious; collector-aware; light occult flavor without edginess"
  audience:
    - collectors
    - gift-buyers
    - trend-followers (US / JP / CN)
  emphasis:
    - surprise factor
    - curation quality
    - global shipping reach
  forbidden_words:
    - guaranteed
    - cheapest
    - scam
    - fake
  forbidden_behavior:
    - competitor name-drops
    - unverified rarity claims
    - aggressive scarcity / urgency tactics

